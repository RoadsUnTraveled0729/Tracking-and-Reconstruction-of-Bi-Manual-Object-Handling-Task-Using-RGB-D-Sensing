<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">Person and object reconstruction</title>
<desc id="desc">RGB-D capture feeds separate person and object pipelines. Timestamped outputs merge with state flags and enter Unity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect width="920" height="350" fill="#ffffff"/>
<g fill="#f1f5f9" stroke="#334155" stroke-width="2">
<rect x="25" y="127" width="165" height="90" rx="8"/>
<rect x="255" y="35" width="255" height="100" rx="8"/>
<rect x="255" y="215" width="255" height="100" rx="8"/>
<rect x="575" y="120" width="160" height="110" rx="8"/>
<rect x="790" y="127" width="110" height="90" rx="8"/>
</g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
<path d="M190 157 L220 157 L220 85 L255 85"/><path d="M190 187 L220 187 L220 265 L255 265"/>
<path d="M510 85 L545 85 L545 150 L575 150"/><path d="M510 265 L545 265 L545 200 L575 200"/>
<path d="M735 175 L790 175"/>
</g>
<g font-family="Arial, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
<text x="107" y="160">RGB-D capture</text><text x="107" y="187">camera or recording</text>
<text x="382" y="63">Person pipeline</text><text x="382" y="91">landmarks + depth</text><text x="382" y="117">arm kinematics + recovery</text>
<text x="382" y="245">Object pipeline</text><text x="382" y="273">ArUco marker + depth</text><text x="382" y="299">scene pose</text>
<text x="655" y="151">Timestamp merge</text><text x="655" y="178" font-size="14">measured / estimated</text><text x="655" y="205">unavailable flags</text>
<text x="845" y="162">Unity</text><text x="845" y="190" font-size="14">reconstruction</text>
</g></svg>
